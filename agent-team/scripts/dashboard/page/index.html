<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent team</title>
<style>
:root { color-scheme: light dark;
  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s6:1.5rem; --s8:2rem;
  --t-title:1.375rem; --t-band:1rem; --t-body:.875rem; --t-small:.75rem;
  --bg:light-dark(#fff, #000000); --fg:light-dark(#1b1f24, #f5f5f5); --muted:light-dark(#59636e, #a1a1a1); --line:light-dark(#d1d9e0, #ffffff14); --card:light-dark(#f6f8fa, #111111); --accent:light-dark(#0969da, #58a6ff); --bar:light-dark(#2da44e, #3fb950); --run:light-dark(#b07a00, #d29922); --err:light-dark(#b4161f, #ff7b72); --err-bg:light-dark(#fff1f0, #241110);
  --edge-merge:light-dark(#cf222e, #f85149); --tint-merge:light-dark(#fff0ee, #2d1918); --edge-build:light-dark(#b07a00, #d29922); --tint-build:light-dark(#fff7e0, #282113);
  --b-neutral:light-dark(#eaeef2, #262626); --b-neutral-fg:light-dark(#424a53, #d4d4d4); --b-low:light-dark(#dafbe1, #1d3420); --b-low-fg:light-dark(#116329, #56d364); --b-medium:light-dark(#fff8c5, #372e1a); --b-medium-fg:light-dark(#7d4e00, #e3b341); --b-high:light-dark(#ffebe9, #3c2422); --b-high-fg:light-dark(#a40e26, #ff7b72); }
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; padding:var(--s3); background:var(--bg); color:var(--fg); font:var(--t-body)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow-wrap:anywhere; }
@media (min-width: 30rem) { body { padding:var(--s6); } }
main { max-width:80rem; margin:0 auto; }
header { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2) var(--s4); margin-bottom:var(--s4); }
h1 { font-size:var(--t-title); line-height:1.2; margin:0; }
#cta { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:var(--s1) var(--s2); margin-left:auto; }
h2 { font-size:var(--t-band); line-height:1.3; font-weight:700; margin:var(--s6) 0 var(--s2); padding-bottom:var(--s1); border-bottom:1px solid var(--line); }
.band:first-child > h2 { margin-top:0; }
h3 { font-size:var(--t-body); font-weight:700; margin:var(--s4) 0 var(--s2); }
details.group > summary { cursor:pointer; margin:var(--s4) 0 var(--s2); }
details.group > summary > h3 { display:inline; margin:0; }
.band > h2 + .group > summary { margin-top:var(--s2); }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
.quiet { color:var(--muted); margin:0; }
#error { margin:0 0 var(--s4); padding:var(--s2) var(--s3); border:1px solid var(--err); border-radius:6px; background:var(--err-bg); color:var(--err); }
#error:empty { display:none; }
.pill { display:inline-block; min-width:1.5em; padding:0 var(--s2); border-radius:999px; background:var(--b-neutral); color:var(--b-neutral-fg); font-size:var(--t-small); font-weight:600; text-align:center; vertical-align:.05em; }
.needs-merge > summary h3 .pill { background:var(--b-high); color:var(--b-high-fg); }
.needs-build > summary h3 .pill { background:var(--b-medium); color:var(--b-medium-fg); }
ul { list-style:none; margin:0; padding:0; }
ul.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); gap:var(--s3); align-items:start; }
.ticket { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:var(--s3); display:flex; flex-direction:column; gap:var(--s1); }
.needs-merge .ticket { background:var(--tint-merge); border-color:var(--edge-merge); border-left-width:4px; }
.needs-build .ticket { background:var(--tint-build); border-color:var(--edge-build); border-left-width:4px; }
.head { display:flex; gap:var(--s1); align-items:baseline; }
.id { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
.head .id { flex:none; }
.title { font-weight:600; }
.head .title { min-width:0; }
.sub { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s1) var(--s2); color:var(--muted); font-size:var(--t-small); }
.next { color:var(--muted); }
ul.rows > li.row { display:flex; flex-direction:column; gap:var(--s1); padding:var(--s2) 0 var(--s2) var(--s2); border-top:1px solid var(--line); border-left:4px solid transparent; }
ul.rows > li.row:first-child { border-top:0; }
ul.rows > li.row.blocked { border-left-color:var(--edge-merge); }
.row .sub .next { flex:1 1 12rem; min-width:0; }
.badge { display:inline-block; max-width:100%; padding:0 var(--s2); border-radius:10px; font-size:var(--t-small); line-height:1.5; background:var(--b-neutral); color:var(--b-neutral-fg); }
.badge.quiet { background:transparent; border:1px solid var(--line); color:var(--muted); }
.badge.risk-low { background:var(--b-low); color:var(--b-low-fg); }
.badge.risk-medium { background:var(--b-medium); color:var(--b-medium-fg); }
.badge.risk-high, .badge.cta-high { background:var(--b-high); color:var(--b-high-fg); }
.badge.cta-medium { background:var(--b-medium); color:var(--b-medium-fg); }
button { font:inherit; font-size:var(--t-small); line-height:1.5; height:1.75rem; padding:0 var(--s3); background:transparent; color:var(--fg); border:1px solid var(--line); border-radius:6px; cursor:pointer; }
button:hover:not(:disabled) { background:var(--b-neutral); border-color:var(--muted); }
button:focus-visible, summary:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
button:disabled { opacity:.5; cursor:default; }
button.copy { margin-left:auto; }
button.copy-icon { display:inline-flex; align-items:center; justify-content:center; flex:none; width:1.5rem; height:1.5rem; padding:0; margin-left:var(--s1); border:0; color:var(--muted); vertical-align:middle; }
button.copy-icon:hover:not(:disabled) { color:var(--fg); }
button.copy-icon[data-state="copied"] { color:var(--bar); }
button.copy-icon[data-state="failed"] { color:var(--err); }
.tabs { display:flex; gap:var(--s1); margin:0 0 var(--s4); border-bottom:1px solid var(--line); }
.tabs button { height:auto; padding:var(--s2) var(--s3); border:0; border-bottom:2px solid transparent; border-radius:0; color:var(--muted); font-size:var(--t-body); }
.tabs button:hover:not(:disabled) { background:transparent; color:var(--fg); border-color:transparent; }
.tabs button[aria-selected="true"], .tabs button[aria-selected="true"]:hover:not(:disabled) { color:var(--fg); font-weight:600; border-bottom-color:var(--accent); }
.cos-card { display:flex; flex-direction:column; gap:var(--s1); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:var(--s3); }
.cos-card .gantt { margin-top:var(--s1); }
.badge.state-running { background:var(--b-low); color:var(--b-low-fg); }
.badge.state-paused { background:var(--b-medium); color:var(--b-medium-fg); }
.pager { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2) var(--s3); margin-top:var(--s3); color:var(--muted); }
details.chart, details.info { margin-top:var(--s1); }
details.chart > summary, details.info > summary { cursor:pointer; color:var(--muted); font-size:var(--t-small); width:fit-content; }
details.chart > summary:hover, details.info > summary:hover { color:var(--fg); }
.info-body { display:flex; flex-direction:column; gap:var(--s3); margin-top:var(--s2); font-size:var(--t-small); }
.info-links { margin:0; }
.info-facts { display:flex; flex-direction:column; gap:var(--s2); }
.info-grid { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); margin:0; }
.info-grid > div { min-width:0; }
.info-grid .wide { flex:1 1 14rem; }
.info-grid dt { color:var(--muted); font-size:var(--t-small); text-transform:uppercase; letter-spacing:.04em; }
.info-grid dd { margin:0; overflow-wrap:anywhere; }
.detail { display:flex; flex-direction:column; gap:var(--s2); padding-top:var(--s2); border-top:1px solid var(--line); }
.detail-head { display:flex; justify-content:space-between; align-items:baseline; gap:var(--s2); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
.detail-open { font-weight:400; text-transform:none; letter-spacing:0; }
.detail-block h4 { margin:0 0 var(--s1); font-size:var(--t-small); font-weight:700; }
.detail-section { max-width:72ch; max-height:30em; overflow:auto; padding-left:var(--s3); border-left:2px solid var(--line); line-height:1.5; overflow-wrap:anywhere; }
.detail-section > :first-child { margin-top:0; }
.detail-section > :last-child { margin-bottom:0; }
.detail-section p, .detail-section ul, .detail-section ol, .detail-section blockquote, .detail-section pre { margin:var(--s2) 0; }
.detail-section ul { list-style:disc; padding-left:1.25rem; }
.detail-section ol { padding-left:1.5rem; }
.detail-section li ul, .detail-section li ol { margin:0; }
.detail-section .md-h { font-weight:700; }
.detail-section blockquote { padding-left:var(--s3); border-left:2px solid var(--line); color:var(--muted); }
.detail-section code, .detail-files .path, .info-links code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.9em; }
.detail-section code { padding:0 .25em; border-radius:3px; background:var(--b-neutral); }
.detail-section pre { padding:var(--s2); border:1px solid var(--line); border-radius:4px; background:var(--card); overflow:auto; line-height:1.4; }
.detail-section pre code { padding:0; background:none; }
.detail-reviews { display:flex; flex-wrap:wrap; gap:var(--s1) var(--s2); }
.badge.pass { background:var(--b-low); color:var(--b-low-fg); }
.badge.fail { background:var(--b-high); color:var(--b-high-fg); }
.detail-files { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:var(--s1) var(--s3); }
.detail-files .delta { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.detail-files .add { color:var(--b-low-fg); }
.detail-files .del { color:var(--b-high-fg); }
.detail-more { margin:var(--s1) 0 0; color:var(--muted); }
.gantt { container-type:inline-size; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:var(--s2) var(--s3); margin-top:var(--s2); }
.grow { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; grid-template-areas:"name dur cost" "track track track"; gap:var(--s1) var(--s3); align-items:center; padding:var(--s2) 0; border-top:1px solid var(--line); }
.grow:first-child { border-top:0; }
.grow .name { grid-area:name; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.grow .track { grid-area:track; }
.grow .dur { grid-area:dur; }
.grow .cost { grid-area:cost; }
.grow.sub { color:var(--muted); font-size:var(--t-small); }
.grow.stale { color:var(--muted); }
.grow.stale .track { opacity:.5; }
.grow.gtotal { grid-template-areas:"name dur cost"; font-weight:600; }
.gnote { margin:var(--s1) 0 0; color:var(--muted); font-size:var(--t-small); }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.track { position:relative; height:var(--s3); background:var(--card); border-radius:3px; }
.bar { position:absolute; top:0; bottom:0; background:var(--bar); border-radius:3px; }
.bar.running { background:var(--run); }
@container (min-width: 36rem) {
  .grow { grid-template-columns:14rem minmax(0, 1fr) 5rem 4.5rem; grid-template-areas:"name track dur cost"; }
  .grow.gtotal { grid-template-areas:"name . dur cost"; }
}
</style>
</head>
<body>
<main>
<header>
<h1>Agent team</h1>
<div id="cta" aria-live="polite"></div>
</header>
<p id="error" role="status"></p>
<div class="tabs" role="tablist" aria-label="Dashboard">
<button type="button" role="tab" id="tab-ship" data-tab="ship" aria-selected="true" aria-controls="panel-ship" tabindex="0">Ship loop</button>
<button type="button" role="tab" id="tab-cos" data-tab="cos" aria-selected="false" aria-controls="panel-cos" tabindex="-1">Chief of Staff</button>
</div>
<div id="panel-ship" role="tabpanel" aria-labelledby="tab-ship">
<div id="status"><p class="quiet">Loading</p></div>
<h2>Merged</h2>
<div id="merged"><p class="quiet">Loading</p></div>
</div>
<div id="panel-cos" role="tabpanel" aria-labelledby="tab-cos" hidden>
<div id="cos"><p class="quiet">Loading</p></div>
</div>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
