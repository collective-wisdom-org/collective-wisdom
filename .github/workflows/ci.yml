name: ci

on:
  pull_request:

# A new push to a PR cancels that PR's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # depth 2: the checkout is GitHub's merge commit, so HEAD^1 is the base tip
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # Which steps this change needs. Anything unsure (script error, no ci-scope line) runs both.
      - name: ci scope
        id: scope
        run: |
          tests=run
          shellcheck=run
          out=$(python3 agent-team/scripts/review_scope.py --ci HEAD^1 HEAD) || true
          echo "$out"
          line=$(printf '%s\n' "$out" | grep '^ci-scope: ' | tail -n 1)
          if [[ "$line" =~ ^ci-scope:\ tests=(run|skip)\ shellcheck=(run|skip)$ ]]; then
            tests=${BASH_REMATCH[1]}
            shellcheck=${BASH_REMATCH[2]}
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "shellcheck=$shellcheck" >> "$GITHUB_OUTPUT"
      - name: shellcheck
        if: steps.scope.outputs.shellcheck == 'run'
        run: shellcheck install.sh tag-release.sh agent-team/scripts/*.sh
      # The test steps run even if shellcheck failed, so one run reports both.
      - name: setup python
        if: ${{ !cancelled() && steps.scope.outputs.tests == 'run' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pytest
        if: ${{ !cancelled() && steps.scope.outputs.tests == 'run' }}
        run: python3 -m pip install pytest
      - name: pytest
        if: ${{ !cancelled() && steps.scope.outputs.tests == 'run' }}
        run: python3 -m pytest -q agent-team/scripts
  # Not a required check (see docs/agents/project.md). Node 24 strips the TypeScript types itself.
  mod-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test agent-team/scripts/dashboard/*.test.ts agent-team/scripts/dashboard/page/app.test.js mods/agent-gantt/hooks/*.test.ts
